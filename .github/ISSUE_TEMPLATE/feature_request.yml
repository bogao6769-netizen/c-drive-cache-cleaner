name: 功能建议
description: 建议新功能或缓存规则
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 新缓存规则请注明应用、具体目录、重建方式及可能损失的数据。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或参考（可选）
